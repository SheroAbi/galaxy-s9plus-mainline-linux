Section "Device"
    Identifier  "Exynos DECON fbdev"
    Driver      "fbdev"
    Option      "fbdev" "/dev/fb0"
    Option      "ShadowFB" "true"
EndSection

Section "Screen"
    Identifier  "Screen0"
    Device      "Exynos DECON fbdev"
    DefaultDepth 24
EndSection

Section "ServerFlags"
    # Waking the panel again needs a physical power-key press, so never blank.
    Option      "BlankTime"   "0"
    Option      "StandbyTime" "0"
    Option      "SuspendTime" "0"
    Option      "OffTime"     "0"
    Option      "AutoAddGPU"  "false"
EndSection
