[Service]
# Render nodes are not tagged "systemd" by Ubuntu's DRM udev rule. Waiting
# for dev-dri-renderD128.device therefore never completes even if the real
# device exists. Check the actual render node with a bounded wait instead.
ExecStartPre=/bin/sh -c 'for i in $(seq 1 100); do [ -e /dev/dri/renderD128 ] && exit 0; sleep 0.2; done; echo "no render node after 20 s, starting anyway" >&2'
